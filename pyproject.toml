[project]
name = "ai-agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.1",
    "openai>=3.8.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tzdata>=2026.4",
]

[project.scripts]
ai-agentic = "ai_agentic:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
